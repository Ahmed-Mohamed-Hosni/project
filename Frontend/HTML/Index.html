<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Balaghny</title>

<link rel="stylesheet" href="../CSS/Index.css">

</head>


<body>


<!-- NAVBAR -->

<div class="navbar">

<div class="logo-container">

<img src="../Images/Logo.png" class="logo-img">

<h2>Balaghny</h2>

</div>

<ul>

<li><button class="nav-btn">Notifications</button></li>

<li><button class="nav-btn">Profile</button></li>

<li><button class="nav-btn logout" id="nav-btn logout">Logout</button></li>

</ul>

</div>





<div class="hero">

<h1>Report Car Problems Easily</h1>

<p>
Contact any car owner safely using their license plate
</p>

<button id="startReport">
Start New Report
</button>

</div>




<section class="report-section" id="reportSection">

<h2>Report a Problem</h2>

<div class="report-actions">

<button id="ocrBtn" class="ocr-btn">
Scan Plate (OCR)
</button>

<p>OR</p>

<div class="manual-input">

<input type="text" placeholder="Enter Plate Number">

</div>

</div>


<select id="problemType">

<option>Select Problem Type</option>
<option>Blocking Driveway</option>
<option>Double Parking</option>
<option>Car Damage</option>
<option>Other</option>

</select>


<button id="submitReport">

Submit Complaint

</button>

</section>



<!-- RECENT REPORTS -->

<section class="recent">

<h2>Recent Reports</h2>

<div class="reports">

<div class="card">

<h3>Plate: ABC123</h3>
<p>Double Parking</p>
<span>Status: Sent</span>

</div>

<div class="card">

<h3>Plate: XYZ445</h3>
<p>Blocking Driveway</p>
<span>Status: Pending</span>

</div>

</div>

</section>



<script src="../JS/Index.js"></script>

</body>
</html>
